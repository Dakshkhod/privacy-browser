services:
  - type: web
    name: PrivacyBrowser-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd Backend
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: |
      cd Backend
      gunicorn -c gunicorn.conf.py main_optimized:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 10000
      - key: DEBUG_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health

  - type: web
    name: privacy-browser-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      cd Frontend
      npm install
      npm run build
    staticPublishPath: Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

