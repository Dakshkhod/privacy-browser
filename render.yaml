services:
  # ============================================================
  # Backend (FastAPI on gunicorn + uvicorn workers)
  # ============================================================
  - type: web
    name: privacybrowser-backend
    env: python
    region: oregon
    plan: free
    # Render injects $PORT automatically; gunicorn.conf.py honors it.
    buildCommand: |
      cd Backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd Backend
      gunicorn -c gunicorn.conf.py main_optimized:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      # ----- Operational -----
      - key: ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"               # free tier: 512 MB RAM — 1 worker is the safe ceiling
      - key: DEBUG_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_REQUEST_SIZE
        value: "262144"          # 256 KB
      - key: MAX_POLICY_TEXT_CHARS
        value: "60000"
      - key: RATE_LIMIT_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW
        value: "3600"
      # ----- Required secrets (generateValue: Render generates once at deploy) -----
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_HASH_SALT
        generateValue: true
      - key: STATS_TOKEN
        generateValue: true
      # ----- Provider keys (sync:false → set in Render dashboard) -----
      - key: GROQ_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # ----- CORS -----
      # Comma-separated explicit origins (the published Vercel domain).
      - key: ALLOWED_ORIGINS
        value: https://privacy-browser.vercel.app
      # Regex that allows chrome-extension://<extensionId> origins.
      - key: ALLOWED_ORIGIN_REGEX
        value: "^chrome-extension://[a-z]{32}$"
      - key: CORS_CREDENTIALS
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

  # ============================================================
  # Uptime keep-alive: ping /health every 10 minutes to defeat the
  # Render free-tier 15-minute idle sleep. Runs inside Render itself —
  # no external service required.
  # ============================================================
  - type: cron
    name: privacybrowser-keepalive
    env: docker
    schedule: "*/10 * * * *"
    dockerCommand: "wget -qO- https://privacybrowser-backend.onrender.com/health || true"
    image:
      url: docker.io/library/alpine:3.20

  # ============================================================
  # Frontend (static — recommended deploy target is Vercel; this is a
  # secondary mirror with rewrites to the backend).
  # ============================================================
  - type: web
    name: privacy-browser-frontend
    env: static
    plan: free
    buildCommand: |
      cd Frontend
      npm ci
      npm run build
    staticPublishPath: Frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://privacybrowser-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: /api
