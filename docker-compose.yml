services:
  backend:
    build: ./Backend
    container_name: privacy-browser-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENV=production
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - API_KEY_HASH_SALT=${API_KEY_HASH_SALT:?API_KEY_HASH_SALT is required}
      - STATS_TOKEN=${STATS_TOKEN:-}
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-^chrome-extension://[a-z]{32}$$}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-false}
      - DEBUG_MODE=false
      - LOG_LEVEL=INFO
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-3600}
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
      - backend-temp:/app/temp
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./Frontend
    container_name: privacy-browser-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx-proxy:
    image: nginx:alpine
    container_name: privacy-browser-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  privacy-browser-network:
    driver: bridge

volumes:
  backend-logs:
  backend-data:
  backend-temp:
