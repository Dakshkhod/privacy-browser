# Fly.io configuration for Privacy Browser Backend
# Deploy with: flyctl launch

app = "privacy-browser-backend"
primary_region = "iad"  # Change to your preferred region

[build]
  builder = "paketobuildpacks/builder:base"
  
[build.args]
  BP_PYTHON_VERSION = "3.11"

[env]
  PORT = "8000"
  BACKEND_HOST = "0.0.0.0"
  BACKEND_PORT = "8000"
  DEBUG_MODE = "false"
  PYTHON_VERSION = "3.11"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[buildpacks]
  buildpack = "paketobuildpacks/python"

