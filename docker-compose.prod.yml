services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    container_name: privacy-browser-backend-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENV=production
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - API_KEY_HASH_SALT=${API_KEY_HASH_SALT:?API_KEY_HASH_SALT is required}
      - STATS_TOKEN=${STATS_TOKEN:-}
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-^chrome-extension://[a-z]{32}$$}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-false}
      - DEBUG_MODE=false
      - LOG_LEVEL=INFO
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-3600}
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
      - backend-temp:/app/temp
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: privacy-browser-frontend-prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  nginx-proxy:
    image: nginx:alpine
    container_name: privacy-browser-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - privacy-browser-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

networks:
  privacy-browser-network:
    driver: bridge

volumes:
  backend-logs:
  backend-data:
  backend-temp:
  nginx-logs:
